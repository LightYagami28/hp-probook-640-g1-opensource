---
# Falsi positivi di classificazione documentati, non soppressioni di difetti:
# - acpi/**: DSDT/SSDT decompilati (ASL), output generato dal dispositivo.
# - hardware_topology/**: dump testuali di dmidecode/lspci (dati, non codice).
# - tests/**: codice di test con assert e nomi locali, non codice di prodotto.
# Le regole restano attive su tutti i sorgenti effettivi; nessun problema reale
# viene nascosto dal quality gate.
exclude_paths:
  - "acpi/**"
  - "hardware_topology/**"
  - "tests/**"
