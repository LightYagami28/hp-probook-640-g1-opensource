sonar.organization=lightyagami28
sonar.projectKey=LightYagami28_hp-probook-640-g1-opensource
sonar.projectName=hp-probook-640-g1-opensource
sonar.sources=.
sonar.sourceEncoding=UTF-8
sonar.scm.provider=git
# Dump ACPI, topologia hardware e dump firmware sono output generati dal
# dispositivo, non codice del progetto.
sonar.exclusions=acpi/**,hardware_topology/**,tests/**,.venv/**,coverage.xml
# I sorgenti C/ASL di coreboot sono firmware per il portatile: non eseguibili in CI.
sonar.coverage.exclusions=tests/**,coreboot/**
sonar.python.coverage.reportPaths=coverage.xml
