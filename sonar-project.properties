sonar.organization=lightyagami28
sonar.projectKey=LightYagami28_hp-probook-640-g1-opensource
sonar.projectName=hp-probook-640-g1-opensource
sonar.sources=.
sonar.sourceEncoding=UTF-8
sonar.scm.provider=git
# Falsi positivi di classificazione, non soppressioni di difetti: Sonar considererebbe
# sorgenti del prodotto anche dati generati e artefatti. Nessuna issue di codice reale
# viene esclusa dal quality gate; le regole restano attive su tutto il codice effettivo.
# - acpi/**: DSDT/SSDT decompilati (ASL), output generato dal dispositivo.
# - hardware_topology/**: dump testuali di dmidecode/lspci (dati, non codice).
# - tests/**: codice di test, con assert e nomi locali, non prodotto.
# - .venv/**, coverage.xml: artefatti di build già ignorati di default.
sonar.exclusions=acpi/**,hardware_topology/**,tests/**,.venv/**,coverage.xml
# Falso positivo di copertura: coreboot/** e' firmware C/ASL del portatile, non viene
# eseguito in CI e quindi non puo' produrre dati di copertura. La sua analisi del
# codice resta attiva; si esclude solo la metrica di copertura, non le issue.
sonar.coverage.exclusions=tests/**,coreboot/**
sonar.python.coverage.reportPaths=coverage.xml
